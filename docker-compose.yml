version: '3.4'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - ./db:/var/lib/postgresql/data
    expose:
      - 5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

  pgweb:
    image: sosedoff/pgweb
    restart: always
    ports: 
      - 5433:8081
    depends_on: 
      - db

  ya_lost_music_bot:
    image: ya-lost-music:${CI_COMMIT_SHORT_SHA-latest}
    build: 
        context: .
        args:
          DB_URL: ${DB_URL-postgres://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?sslmode=disable}
          TG_BOT_TOKEN: ${TG_BOT_TOKEN}
    restart: always
    depends_on:
      - db