services:

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - ./db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: dm
      POSTGRES_DB: dm_dev

  pgweb:
    image: sosedoff/pgweb
    restart: always
    ports: 
      - 5433:8081
    environment:
      DATABASE_URL: postgres://dm:dm@db:5432/dm_dev?sslmode=disable
    depends_on: 
      - db